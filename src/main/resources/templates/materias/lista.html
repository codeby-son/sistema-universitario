<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Matérias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #1f2937;
        }

        .card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #1f2937;
            color: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #d1d5db;
            text-align: left;
        }

        .resultado {
            background: #ecfdf5;
            border: 1px solid #10b981;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .erro {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Cadastro de Matérias</h1>

    <p><a th:href="@{/alunos}">Ir para Alunos</a></p>

    <div th:if="${mensagemErro != null}" class="erro" th:text="${mensagemErro}"></div>

    <div class="card">
        <h2>Nova Matéria</h2>

        <form th:action="@{/materias/salvar}" th:object="${materia}" method="post">

            <label>Nome:</label><br>
            <input type="text" th:field="*{nome}" required><br>

            <label>Código:</label><br>
            <input type="text" th:field="*{codigo}" required><br>

            <label>Descrição:</label><br>
            <textarea th:field="*{descricao}" rows="4"></textarea><br>

            <label>Carga horária:</label><br>
            <input type="number" th:field="*{cargaHoraria}" min="1" required><br>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <div class="card">
        <h2>Buscar Matéria por Código</h2>

        <form th:action="@{/materias/buscar}" method="get">
            <label>Código:</label><br>
            <input type="text" name="codigo" required><br>
            <button type="submit">Buscar</button>
        </form>

        <div th:if="${materiaEncontrada != null}" class="resultado">
            <h3>Matéria encontrada:</h3>
            <p><strong>Nome:</strong> <span th:text="${materiaEncontrada.nome}"></span></p>
            <p><strong>Código:</strong> <span th:text="${materiaEncontrada.codigo}"></span></p>
            <p><strong>Descrição:</strong> <span th:text="${materiaEncontrada.descricao}"></span></p>
            <p><strong>Carga horária:</strong> <span th:text="${materiaEncontrada.cargaHoraria}"></span></p>
        </div>

        <div th:if="${materiaEncontrada == null and param.codigo != null}" class="erro">
            Matéria não encontrada.
        </div>
    </div>

    <div class="card">
        <h2>Lista de Matérias</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Código</th>
                <th>Descrição</th>
                <th>Carga Horária</th>
            </tr>

            <tr th:each="materiaItem : ${materias}">
                <td th:text="${materiaItem.id}"></td>
                <td th:text="${materiaItem.nome}"></td>
                <td th:text="${materiaItem.codigo}"></td>
                <td th:text="${materiaItem.descricao}"></td>
                <td th:text="${materiaItem.cargaHoraria}"></td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
